services:

  web:
    build: .
    container_name: smart_expiry_web
    ports:
      - "8081:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: smart_expiry_db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: expiry_management
      MYSQL_USER: expiry_user
      MYSQL_PASSWORD: expiry_password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: