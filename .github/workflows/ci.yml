name: Smart Expiry CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-and-build:

    runs-on: ubuntu-latest

    steps:

      # 1. Get the project from GitHub
      - name: Checkout Project
        uses: actions/checkout@v4


      # 2. Install PHP 8.2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'


      # 3. Check PHP version
      - name: Check PHP Version
        run: php -v


      # 4. Check all PHP files for syntax errors
      - name: Check PHP Syntax
        run: |
          find . -name "*.php" -print0 | xargs -0 -n1 php -l


      # 5. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t smart-expiry-system:latest .


      # 6. Check Docker Hub username
      - name: Check Docker Hub Username
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "ERROR: DOCKERHUB_USERNAME secret is missing."
            exit 1
          fi

          echo "Docker Hub username is configured."


      # 7. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # 8. Tag Docker image
      - name: Tag Docker Image
        run: |
          docker tag smart-expiry-system:latest \
          ${{ secrets.DOCKERHUB_USERNAME }}/smart-expiry-system:latest


      # 9. Push Docker image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/smart-expiry-system:latest