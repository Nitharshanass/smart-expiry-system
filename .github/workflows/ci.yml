name: Smart Expiry CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test-and-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Check PHP Version
        run: php -v

      - name: Check PHP Syntax
        run: |
          find . -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Build Docker Image
        run: |
          docker build -t smart-expiry-system:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag smart-expiry-system:latest ${{ secrets.DOCKERHUB_USERNAME }}smart-expiry-system:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}smart-expiry-system:latest